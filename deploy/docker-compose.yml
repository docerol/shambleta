# Shambleta — stack de produção para Coolify (beta fechado web).
#
# Importe como "Docker Compose" no Coolify. Domínios (menu Domains de cada
# serviço):
#   web       → https://seudominio.com        (client web; proxy injeta TLS)
#   game      → https://ws.seudominio.com    (WebSocket; TLS do proxy)
#   companion → SEM domínio próprio. O tráfego dele entra pelo domínio do `web`:
#               /checkout/ e /webhooks/payments são proxied para companion:8901
#               (deploy/web/nginx.conf). Ver COOLIFY.md §2/§4.
#
# Depois do primeiro deploy sete os Build Args do serviço web:
#   SHAMBLETA_SERVER_ADDRESS = ws.seudominio.com
#   (o client web é embutido com esse domínio — rebuild do web após mudar).
#
# Nada aqui deve ser exposto fora do proxy: game (6108) e companion (8901)
# ficam na rede interna do Coolify, acessíveis só pelos domínios acima.
# O companion não tem porta publicada nem domínio próprio — e ainda assim é a
# única porta de entrada do dinheiro: o nginx do serviço `web` faz proxy de
# /checkout/ (o client do browser) e /webhooks/payments (o provedor de
# pagamento) para companion:8901 na rede interna. É por isso que a URL que se
# registra no painel do Mercado Pago é https://seudominio.com/webhooks/payments
# — mesma origem do jogo, sem CORS e sem segundo certificado.
#
# ----------------------------------------------------------------------------- log
# Todo serviço abaixo declara `logging:` com `max-size`/`max-file`. Não é higiene,
# é o disco do banco: o driver padrão do docker (json-file) escreve
# <data-root>/containers/<id>/<id>-json.log sem teto nenhum — o teto NÃO existe por
# default, e num host com um único disco os logs e os volumes nomeados (`game-data`
# = live.db + `-wal` + sql-backups, `game-backups`) caem no mesmo filesystem, pois
# o volume nomeado vive em <data-root>/volumes/. Um log verboso enche o disco e o
# próximo commit do SQLite falha em fsync: o `mem_limit` do serviço `game` protege
# a RAM e não protege nada disso. Com o teto abaixo o pior caso é 3 × 10 MiB por
# serviço ≈ 180 MiB no total, e o custo de trocar log por disponibilidade do banco
# é decidido aqui, não num 3h da manhã.
#
# O valor não é medida, é orçamento: 10 MiB/serviço cabe ~50 mil linhas de log de
# nginx (o primeiro load do client é ~36 MiB gzip, deploy/WEB_SLIM.md:69) e uma
# semana de `--server` ocioso; não foi medido o volume real de log deste stack em
# beta **[NÃO MEDIDO]** — conferir com o comando de deploy/OPS_RUNBOOK.md §4.4 e
# ajustar `max-file` (o arquivo que gira é o único número que muda o teto de disco)
# antes de tocar em `max-size`.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        SHAMBLETA_SERVER_ADDRESS: ${SHAMBLETA_SERVER_ADDRESS:-}
        SHAMBLETA_SERVER_PORT: ${SHAMBLETA_SERVER_PORT:-0}
    image: shambleta/web:${SHAMBLETA_TAG:-local-unpinned}
    pull_policy: never
    restart: unless-stopped
    # É o serviço mais loguento do stack: o log de acesso do nginx é uma linha por
    # request (deploy/web/nginx.conf não desliga access_log), e um beta com scraper
    # ou health-probe escreve sozinho bem mais que 10 MiB/dia. Ver o bloco
    # "log" no cabeçalho deste arquivo para o porquê do teto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # PORQUÊ só reserva, sem teto: este é o serviço que serve o primeiro load de
    # ~35 MiB (deploy/WEB_SLIM.md:69) e não medimos nginx aqui (a máquina do
    # gate não tem docker). Teto sem medida vira causa de indisponibilidade — o
    # OOM-kill cairia em cima da única porta de entrada do jogo. Pendência de
    # lançamento: rodar `docker stats` numa semana de beta e transformar a
    # reserva em limite com o número medido (deploy/OPS_RUNBOOK.md §4).
    mem_reservation: 64M
    healthcheck:
      # O probe anterior (o HEALTHCHECK da imagem, deploy/web/Dockerfile:50) era
      # `wget -qO- http://127.0.0.1/` — e `location /` termina em
      # `try_files $uri $uri/ /index.html` (deploy/web/nginx.conf:306), então
      # QUALQUER caminho devolve 200: o check não conseguia falhar, nem com o
      # html/ vazio de build, nem com a landing page no lugar do jogo. Aqui o
      # probe exige o marcador do export no corpo realmente servido:
      # `src="index.js"` existe em build/Web/index.html (o shell do Godot) e não
      # existe em deploy/web/landing/index.html. Continua sem tocar no upstream:
      # o `web` não pode ficar unhealthy por culpa do companion (ver
      # depends_on abaixo). A porta é a que o nginx binda (`listen 80;` em
      # deploy/web/nginx.conf:43) e 127.0.0.1 porque `listen 80;` é IPv4.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/index.html | grep -q 'index\\.js'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      game:
        condition: service_healthy
      # O nginx deste serviço é o único caminho de entrada do companion (checkout
      # do browser + webhook do provedor). service_started basta: o nginx resolve
      # o upstream por resolver/variável a cada request, então um companion ainda
      # esquentando responde 502 em vez de derrubar o `web` no boot. Com o
      # healthcheck próprio do companion (abaixo), a saúde dele é alertável sem
      # amarrar o site estático ao destino do dinheiro.
      companion:
        condition: service_started

  game:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: shambleta/game:${SHAMBLETA_TAG:-local-unpinned}
    pull_policy: never
    restart: unless-stopped
    # O log deste serviço é o único que fala com o jogador no terminal: cada
    # conexão, cada comando broadcast do drain e todo `print` do server caem aqui.
    # Com teto de 3 arquivos o histórico de uma sessão de beta ainda cabe no
    # orçamento de disco do §log do cabeçalho — sem teto, ele come o mesmo
    # filesystem do live.db.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # O teto de memória existe para proteger o HOST, não o jogo: SIGKILL num
    # processo que é o único writer do SQLite custa até `BackupPlayersSec` = 600 s
    # de ouro que só existe em memória (sources/sql/SQLCommons.gd:@BackupPlayersSec; o efeito é o
    # §7.1 da AUDITORIA_2026-09-27) e deixa `-wal` órfão (medido: 1.8 MiB de
    # testing.db-wal com zero jogadores). Por isso o limite é ~3x o piso medido,
    # não um número apertado:
    #   piso medido nesta máquina: 460 MiB RSS, server headless, 0 jogadores, 30 s
    #   (ver deploy/OPS_RUNBOOK.md §4 pelo comando de reprodução).
    mem_limit: 1536M
    mem_reservation: 640M
    # O loop principal é um só e anda a 30 FPS (sources/launcher/LauncherCommons.gd:19
    # ServerMaxFPS), ou seja, ~1 core em runtime; o segundo core cobre o boot
    # (migrations + mundo, que tem de caber no start_period de 40 s abaixo) e a
    # thread do worker de backup (sources/sql/SQLBackups.gd:183).
    cpus: "2"
    # 75 s cobrem o drain inteiro: até 10 s para o `CheckCanary` ver o arquivo
    # (duas batidas de `checkInternalSec` = 5 s, sources/world/ShutdownCanary.gd:@checkInternalSec)
    # + 30 s e 15 s dos avisos (sources/world/ShutdownCanary.gd:10-13) + até 2 s do join do worker
    # (`BackupCheckIntervalSec`, sources/sql/SQLCommons.gd:@BackupCheckIntervalSec lido em
    # sources/sql/SQLBackups.gd:187) + folga de fsync no `db.close_db()`
    # (sources/sql/SQL.gd:1785) = 57 s de pior caso, com 18 s de folga.
    # QUEM aciona o drain mudou em 2026-09-28: o `ENTRYPOINT` da imagem
    # (deploy/server/Dockerfile, deploy/server/entrypoint.sh) intercepta SIGTERM e
    # toca o canary — `docker compose stop`, `down` e o redeploy do Coolify agora
    # derrubam os jogadores e chamam `Launcher.Quit()` em vez de sair com 143 no
    # meio de um `BackupPlayersSec`. Este grace é o teto do qual o entrypoint tem de
    # sair antes; se ele não sair, é o docker quem mata, e a régua do §3 de
    # deploy/OPS_RUNBOOK.md diz como distinguir os dois no log.
    stop_grace_period: 75s
    healthcheck:
      # P1 Deploy / Performance: healthcheck de produção confirma estabilidade da sessão.
      # SOM-IDLE L1: forma CMD (lista) não interpreta "||" nem "exit" — isso era
      # passado como argumento ao curl. Agora é um GET real no /healthz do
      # MetricsServer (127.0.0.1:9400, servido pelo próprio processo do game).
      # start_period cobre o boot (migrations + mundo), que é quando o probe
      # responde 503; esquema parado é o outro 503, e desse o start_period não salva.
      # 127.0.0.1 literal, não `localhost`: o MetricsServer binda SOMENTE IPv4 em
      # 127.0.0.1 (sources/system/MetricsServer.gd:26 BindAddress, porta em :25
      # DefaultPort) — com `localhost` e `::1` em /etc/hosts o primeiro try é
      # connection refused. A porta 9400 é conferida contra o código por
      # `scripts/check_compose.sh`, junto com as demais.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9400/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      # TLS termina no proxy do Coolify — server binda ws:// plain na 6108.
      SHAMBLETA_PROXY_TLS: "1"
      # Modo produção: live.db + porta 6108 (o default sem isto é testing.db +
      # 6118, e o companion escreve grants no live.db — receita perdida).
      # Literal de propósito: não deve poder ser desligado por env ausente.
      SHAMBLETA_PRODUCTION: "1"
      # C2 (auditoria 2026-09-24): este arquivo É a produção, e a produção nasce
      # fechada para anúncio auto-declarado — `SHAMBLETA_AD_STUB` fica FORA dele
      # de propósito. Antes vinha `"1"` aqui, o que fazia o default de todo deploy
      # ser o caminho em que o client afirma que assistiu e o servidor credita
      # (hoje com cota e nonce de uso único, mas ainda sem prova de exibição).
      # O beta que quiser rewarded ads antes do SSV do portal liga a env no painel
      # (deploy/COOLIFY.md, "Criar o projeto"), nunca no repositório. Sem a env,
      # `MintAdSlot` devolve `ad_source` e nenhum placement credita.
      # G1 (auditoria 2026-09-24, Bloco 1 #7): o beta LIGA o espinho sazonal.
      # Sem esta env, `SeasonsEnabled()` é false e criação/fechamento/liquidação
      # viram no-op — o shell entregaria Season Pass e placar de temporada sobre
      # uma temporada que nunca existe. Com ela, o relógio de temporada
      # (`SQLCommons.SeasonClockIntervalSec`, 5 min, disparando também no boot, em
      # `SQLBackups`) abre os 30 dias com as regras congeladas de
      # `SeasonS1Rules()`, fecha a vencida congelando o placar no `ends_at` e
      # liquida os prêmios em gems (não-casháveis) com prova de idempotência no
      # ledger. Sem a env, o relógio continua rodando e não faz nada.
      SHAMBLETA_ENABLE_SEASONS: "1"
      # Diretório offsite de backups (best-effort, verificado com restore probe).
      # Default LIGADO apontando no volume dedicado abaixo: antes era `${...:-}`
      # vazio, e vazio desliga o push inteiro (`GetOffsiteBackupPath` devolve ""
      # → `PushOffsite` sai na primeira linha, sources/sql/SQLCommons.gd:99-100 e
      # sources/sql/SQLBackups.gd:37-38). Sobrescreva com um mount NFS/S3-fuse
      # real para sair do mesmo host — aqui o ganho é sobreviver ao container e a
      # um `docker compose down -v` acidental não levar as duas cópias juntas.
      SHAMBLETA_OFFSITE_BACKUPS: ${SHAMBLETA_OFFSITE_BACKUPS:-/data-backups}
    volumes:
      # live.db + sql-backups ficam aqui (user:// com HOME=/data →
      # /data/.local/share/Shambleta/, layout conferido por
      # tests/deploy_ops_test.gd). ATENÇÃO: é por isto que o backup nasce
      # DENTRO do volume do banco: o `GetBackupPath()` (sources/sql/SQLCommons.gd:@GetBackupPath)
      # vale `user://sql-backups/` (sources/sql/SQLCommons.gd:8 + sources/system/Path.gd:55).
      - game-data:/data
      # Segunda cópia em volume próprio: `docker compose down -v`, um rebuild com
      # `-v` ou um rm -rf no /data não podem apagar o histórico e o banco no mesmo
      # golpe. O worker copia para cá e ancora com `VerifyBackupRestorable` antes
      # de reportar sucesso (sources/sql/SQLBackups.gd:43-50).
      - game-backups:/data-backups

  companion:
    build:
      context: ..
      dockerfile: deploy/companion/Dockerfile
    image: shambleta/companion:${SHAMBLETA_TAG:-local-unpinned}
    pull_policy: never
    restart: unless-stopped
    # Log da frente do dinheiro: cada webhook tem uma linha de acesso e o
    # ThreadingHTTPServer imprime stack trace de request falho no stderr. É o
    # serviço cujo log mais interessa numa post-mortem de pagamento, então o teto
    # gira 3 arquivos em vez de 1: `max-file: 3` é o que preserva o webhook
    # anterior ao incidente, não um número decorativo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Não existia: o `/health` do companion (companion/server.py:1414-1416) já
      # respondia 200 `{"ok": true, "pending": N}` e ninguém probeava — ou seja,
      # a frente do dinheiro podia estar em crash-loop e o único sintoma era
      # webhook 502 no nginx. É um probe honesto: a rota abre a MESMA conexão
      # SQLite do grant, então 200 quer dizer "banco certo e alcançável", não
      # apenas "processo vivo". Porta: `EXPOSE 8901` (`deploy/companion/Dockerfile:38`),
      # CMD `"--port", "8901"` (`deploy/companion/Dockerfile:53`) e bind `0.0.0.0`
      # (`deploy/companion/Dockerfile:46`); busybox wget sai !=0 em 4xx/5xx. O timeout
      # é 6 s, acima do `PRAGMA busy_timeout=5000` (companion/server.py:1073): um lock
      # de esperar, não ficar unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8901/health"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    # Piso medido nesta máquina: 31 MiB RSS, ocioso, sem carga (comando em
    # deploy/OPS_RUNBOOK.md §4). É stateless entre requests (cada request abre a
    # própria conexão), então OOM aqui não perde dinheiro: o provedor re-tenta o
    # webhook e a idempotência do grant decide o resto. 256 M = ~8x o piso, que é
    # a conta do ThreadingHTTPServer (1 thread por request) com corpo de webhook
    # em memória. cpus 0.5: o único CPU-bound é o HMAC + re-fetch por request.
    mem_limit: 256M
    mem_reservation: 64M
    cpus: "0.5"
    depends_on:
      # O companion abre o SQLite do game no boot e sai com exit 2 se o arquivo
      # não existe. Num volume novo isso aconteceria antes do game criar live.db
      # — crash-loop exatamente na fronteira do dinheiro. service_healthy garante
      # que o banco já está de pé (e na porta do healthcheck real) antes de escutar
      # webhook.
      # (exit 2 conferido nesta máquina: `python3 companion/server.py --db
      # /tmp/nao-existe.db --port 8940 ...` → "database not found", exit=2 — o
      # `companion/server.py:2174-2176` que este comentário afirma.)
      game:
        condition: service_healthy
    environment:
      # (1c) produção valida assinatura do provedor (Mercado Pago); só troque
      # p/ "shared" + allow-dev num sandbox local — nunca junto de dinheiro real.
      SHAMBLETA_WEBHOOK_PROVIDER: ${SHAMBLETA_WEBHOOK_PROVIDER:-mercadopago}
      SHAMBLETA_MP_WEBHOOK_SECRET: ${SHAMBLETA_MP_WEBHOOK_SECRET:-}
      SHAMBLETA_MP_ACCESS_TOKEN: ${SHAMBLETA_MP_ACCESS_TOKEN:-}
      # Origem pública do jogo, usada nos back_urls da preferência (a volta do
      # checkout MP para <base>/checkout_return.html, página que o serviço `web`
      # serve na raiz). Vazio = preferência sem back_urls: o jogador fica na página
      # do provedor e o grant continua chegando pelo webhook — funciona, mas é UX
      # pior. Preencha com https://seudominio.com no beta.
      SHAMBLETA_MP_BACK_URLS_BASE: ${SHAMBLETA_MP_BACK_URLS_BASE:-}
      SHAMBLETA_STRIPE_WEBHOOK_SECRET: ${SHAMBLETA_STRIPE_WEBHOOK_SECRET:-}
      SHAMBLETA_WEBHOOK_SECRET: ${SHAMBLETA_WEBHOOK_SECRET:-}
      SHAMBLETA_ALLOW_DEV_WEBHOOK: ${SHAMBLETA_ALLOW_DEV_WEBHOOK:-}
      SHAMBLETA_CATALOG_FILE: ${SHAMBLETA_CATALOG_FILE:-}
      SHAMBLETA_WEBHOOK_TOLERANCE: ${SHAMBLETA_WEBHOOK_TOLERANCE:-300}
    volumes:
      # MESMO volume do game: grant_queue é consumido do mesmo SQLite (WAL).
      - game-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # cloudflared é o mais tagarela dos seis: loga cada conexão do túnel, cada
    # retry e cada reject no stderr, e é binário de terceiro que ninguém patcheia
    # aqui. Sem teto, é ele que enche o disco primeiro — e o volume que ele enche
    # é o filesystem do live.db (ver o bloco "log" no cabeçalho deste arquivo).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Reserva sem teto, de propósito: é binário de terceiro, não medimos aqui e a
    # falha dele (túnel derrubado) é justamente o que um OOM-kill causaria. Só o
    # `depends_on` curto (service_started): o túnel não tem nada que probear — a
    # imagem não traz shell nem wget, então healthcheck aqui seria um check que
    # falha por falta de ferramenta, não por defeito (verificação em
    # deploy/OPS_RUNBOOK.md §2, que mede o túnel por fora).
    mem_reservation: 32M
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN:-}
    depends_on:
      - game
    command: tunnel run

  # ------------------------------------------------------------------ observação
  # O `deploy/alerts.rules.yml` existe desde a AUDITORIA §18 para que
  # `grant_queue_pending > 0` por 10 min pagine (`:severity: page`) — mas NINGUÉM
  # carregava o arquivo: `grep -nE "prometheus|rule_files|alertmanager"` nos
  # compose desta pasta não achava um serviço só que fosse. Regra de alerta sem
  # evaluator é texto morto: não é alerta quebrado, é alerta absurdo — dispara
  # nunca e ausência de incêndio é indistinguível de ausência de fogo. Os dois
  # serviços abaixo são o leitor faltante; o gate (`scripts/check_compose.sh`)
  # agora exige que a referência exista E que todo serviço nomeado por ela exista.
  prometheus:
    build:
      context: ..
      dockerfile: deploy/monitoring/prometheus.Dockerfile
    image: shambleta/prometheus:${SHAMBLETA_TAG:-local-unpinned}
    pull_policy: never
    # O /metrics do jogo binda SÓ 127.0.0.1:9400, sem auth e sem TLS
    # (sources/system/MetricsServer.gd:21-22). De outro container isso é
    # inalcançável — não há firewall a liberar. Compartilhar o namespace do `game` é
    # o que torna o loopback do jogo o loopback do scraper, sem mexer no bind
    # (que é escolha de segurança do arquivo de outro dono). Consequências, todas
    # deliberadas: o scraper herda o ciclo de vida do jogo (game morto ⇒ scrape cai
    # junto ⇒ `ServerSemMetrica` dispara, que é o certo), a porta 9090 é
    # alcançável só por dentro do host, e `network_mode` proíbe `networks`/`ports`
    # neste bloco — por isso nenhum dos dois aparece aqui.
    network_mode: service:game
    restart: unless-stopped
    # O log do Prometheus não é opcional: é a única coisa que responde "por que
    # esta regra não disparou" depois do fato (série de scrape, reload de config,
    # regra com erro de template). Fica em volume próprio (prometheus-data) para o
    # TSDB, mas o stdout vai para o json-file do host como o dos outros seis.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Binário com `/bin/sh`+`wget` (variante -busybox do Dockerfile): o probe pode
    # existir de verdade. A porta 9090 é conferida contra o `--web.listen-address`
    # da própria linha abaixo.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:9090
      # 15 dias cobrem o `for: 6h` das regras e uma semana de beta com folga, e é o
      # bastante para responder "desde quando isso está doendo?" sem disco infinito.
      # O tamanho real não foi medido aqui — [NÃO MEDIDO]; ver OPS_RUNBOOK §4.2.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
    volumes:
      # TSDB em volume nomeado: restart do container não apaga o histórico que as
      # regras de `for:`/`avg_over_time` precisam para decidir.
      - prometheus-data:/prometheus
    # Só `service_started`: com `network_mode: service:game` o namespace já é o do
    # game, e `service_healthy` criaria um ciclo de espera inútil (o probe de 9090
    # depende deste container, não do contrário).
    depends_on:
      game:
        condition: service_started
    mem_reservation: 128M

  alertmanager:
    build:
      context: ..
      dockerfile: deploy/monitoring/alertmanager.Dockerfile
    image: shambleta/alertmanager:${SHAMBLETA_TAG:-local-unpinned}
    pull_policy: never
    restart: unless-stopped
    # O log dele é o que responde "o alerta chegou e para onde foi": o
    # alertmanager imprime cada grupo silenciado/roteado. Teto igual aos outros
    # seis (ver o bloco "log" no cabeçalho deste arquivo).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # correção de fato, 2026-09-28: o comentário antigo dizia "sem healthcheck
    # porque a imagem oficial não traz shell nem wget". A base do
    # prom/alertmanager:v0.34.1 é `quay.io/prometheus/busybox` (linha 3 do
    # Dockerfile de release upstream), então shell existe — e é justamente por
    # isso que a imagem tem entrypoint agora
    # (deploy/monitoring/alertmanager.Dockerfile). O probe abaixo é a mesma forma
    # do probe do `prometheus` acima, na mesma família de base; se um dia a base
    # trocar para distroless, o sintoma é o container não subir (o entrypoint é
    # /bin/sh), não um probe falso.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=:9093
      - --storage.path=/alertmanager
    environment:
      # Os dois destinos humanos do `severity: page`. Vindos de env porque a URL de
      # webhook é credencial e o repositório é open source; o render da imagem os
      # materializa no config no boot (deploy/monitoring/render-alertmanager-config.sh).
      # Sem o destino do page E sem o ack abaixo, o render sai != 0 e SÓ ESTE
      # container não sobe — nada nesta stack tem `depends_on: alertmanager`, então
      # o jogo, o companion e o prometheus continuam de pé. O caso tem nome e os
      # três estados (destino / sem pager declarado / sem pager silencioso) são
      # conferidos rodando este script de fato por scripts/check_compose.sh (bloco
      # "TRÊS ESTADOS DO PAGER"). A decisão está no header do render, não num doc.
      SHAMBLETA_ALERT_PAGE_WEBHOOK_URL: ${SHAMBLETA_ALERT_PAGE_WEBHOOK_URL:-}
      SHAMBLETA_ALERT_TICKET_WEBHOOK_URL: ${SHAMBLETA_ALERT_TICKET_WEBHOOK_URL:-}
      # "Este ambiente não tem on-call humano, e alguém decidiu isso". Só o valor
      # exato `1` declara; o default `0` mantém o estado silencioso impossível.
      SHAMBLETA_ALERT_NO_PAGER_ACK: ${SHAMBLETA_ALERT_NO_PAGER_ACK:-0}
    volumes:
      - alertmanager-data:/alertmanager
    depends_on:
      - prometheus
    mem_reservation: 32M

volumes:
  game-data:
  # Backup em volume próprio: é a única coisa que sobrevive ao ciclo de vida do
  # container do jogo. O gate `scripts/check_compose.sh` exige que ele exista e
  # que não seja o mesmo volume do banco.
  game-backups:
  # Série temporal das métricas (rules + alertas): sem isto, um rebuild do
  # container apaga o histórico que responde "desde quando".
  prometheus-data:
  alertmanager-data:

  # Cloudflared tunnel — expõe o jogo via WSS sem abrir portas no firewall da VPS.
  # Requer token do Cloudflare Zero Trust (CLOUDFLARED_TOKEN).
  # NOTA: não declarar como volume nomeado aqui; o serviço cloudflared acima
  # cuida da inicialização do tunnel.

# --------------------------------------------------------------------- contexto
# `build.context: ..` não é typo nem preferência: é o diretório do PRIMEIRO `-f`,
# e nada mais. O compose resolve `build.context` contra o diretório do projeto, e
# o diretório do projeto, sem `--project-directory`, é o diretório do arquivo de
# compose (aqui `deploy/`), não o CWD de quem digitou o comando. Com `context: .`
# o contexto era `deploy/` e o `dockerfile:` (relativo ao contexto) virava
# `deploy/deploy/...`: medido no runner, `docker compose -f deploy/docker-compose.yml
# build` devolveu `resolve : lstat /home/runner/work/shambleta/shambleta/deploy/deploy:
# no such file or directory` no job container-images (log de 2026-09-29, commits
# 126b086 e 1f540a1). Os cinco serviços buildam com o mesmo contexto porque os cinco
# Dockerfiles copiam caminhos da RAIZ (`COPY . .`, `COPY data/conf/paid_catalog.json .`,
# `COPY deploy/web/nginx.conf ...`) — contexto certo é o repositório, e é a única
# leitura que faz `docker compose -f deploy/docker-compose.yml build` (CI, ROLLBACK.md,
# STAGING.md), `cd deploy && docker compose up -d` (README.md) e o import do Coolify
# resolverem o mesmo lugar sem flag nenhuma. Consequência que a régua de
# scripts/check_compose.sh cobra: NENHUM comando pode passar `--project-directory`,
# porque ele move o `..` para fora do repositório.
