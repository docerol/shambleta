# Shambleta — Staging override (Coolify environment: staging)
# Aplicado POR CIMA do deploy/docker-compose.yml (`-f docker-compose.yml -f
# docker-compose.staging.yml`). Mesma imagem, mesmo Dockerfile da produção.
#
# NÃO é um arquivo standalone: só declara os três campos que mudam. `restart`,
# healthchecks, limites de recurso, `stop_grace_period` e os `depends_on` vêm do
# base — usados sozinho, estes services não têm imagem nem rebuild. Por isso o
# gate (`scripts/check_compose.sh`) confere os dois juntos, e o comando
# canônico de conferir está em deploy/STAGING.md:72.
#
# Não existe "modo staging" no código: `LauncherCommons.IsTesting` só conhece
# production vs testing. O que torna esta pilha staging é o volume próprio e o
# webhook sandbox. Um `SHAMBLETA_ENV=staging` aqui seria um knob que ninguém lê —
# ele já existiu neste arquivo e era exatamente isso.
#
# Teto de log NÃO é repetido aqui de propósito: nenhum bloco deste override toca
# em `logging:`, e o merge do Compose Spec é por chave — os seis `json-file` com
# `max-size`/`max-file` do base continuam valendo no doc resolvido. Repetir seria
# criar um segundo lugar onde o teto existe, que é exatamente o tipo de par que
# diverge quando alguém mexe só num. O que garante isso não é esta frase: é o gate
# rodar a régua de teto de log sobre o doc MESCLADO (`-f base -f staging`), além do
# base, então apagar o teto do base quebra o portão mesmo com staging intacto.
services:
  web:
    # O endereço do game server NÃO é lido em runtime por este serviço: o container
    # `web` é nginx puro (deploy/web/Dockerfile não tem entrypoint que leia env) e o
    # client lê `Server-Address` do settings.cfg **gravado dentro do pck pelo build**
    # (ARG + `sed`). Por isso a correção mora em `build.args`, e não em
    # `environment:` — que era onde estas duas linhas estavam: inertes, elas faziam
    # o endereço de staging depender do valor que o operator tivesse no `.env` do
    # projeto (é dele que o `${...}` do compose base interpolate). Reaproveitar o env
    # da produção deixaria o client de staging apontando para o game server da
    # produção. AQUI o valor é literal de propósito: o override é a fonte do endereço
    # de staging, e um `${VAR:-}` vazio produziria `Server-Address=""`, que
    # `Launcher._ready` ignora e deixa o default compilado.
    build:
      args:
        # É o endereço do GAME SERVER visto pelo client web, não o do site: no
        # browser o client monta `wss://<Server-Address>` **sem porta**
        # (`sources/network/client/Client.gd`), e o nginx do serviço `web` não
        # faz upgrade de WebSocket — apontar para o domínio do próprio web
        # devolve o `index.html` (try_files) no lugar do handshake. staging usa
        # o mesmo par de domínios da produção (deploy/COOLIFY.md §3): o web em
        # `staging.seudominio.com`, o WS proxy (Coolify/Traefik) em
        # `ws.staging.seudominio.com` → game:6108.
        SHAMBLETA_SERVER_ADDRESS: ws.staging.seudominio.com
        SHAMBLETA_SERVER_PORT: "0"
  game:
    volumes:
      # Os dois serviços trocam de volume JUNTO: o grant_queue do companion é
      # consumido do MESMO SQLite (WAL) que o servidor abre. Redirecionar só um
      # deles deixa o companion escrevendo grants num banco que o jogo nunca
      # abre — receita perdida em silêncio, o defeito que D1 corrigiu na produção.
      #
      # E cada alvo tem de ser reescrito AQUI: o compose faz merge de `volumes`
      # por caminho de destino, então um `/data-backups` que só existisse no base
      # herderia o `game-backups` da produção — staging escrevendo o histórico de
      # backup ao lado do backup de dinheiro real. Mesma família de defeito do
      # parágrafo acima, um nível abaixo.
      - game-data-staging:/data
      - game-backups-staging:/data-backups
  companion:
    volumes:
      - game-data-staging:/data
    environment:
      - SHAMBLETA_WEBHOOK_PROVIDER=shared
      - SHAMBLETA_ALLOW_DEV_WEBHOOK=1
      - SHAMBLETA_WEBHOOK_SECRET=${STAGING_WEBHOOK_SECRET:-}
  alertmanager:
    environment:
      # #90, estado 2: "sem paguer, DECLARADO". Staging não tem escala de on-call
      # humana — e é justamente essa frase que, escrita num arquivo, deixa de ser
      # o silêncio que o achado descreve. O base traz `SHAMBLETA_ALERT_NO_PAGER_ACK`
      # com default `0`, que faz o render do container recusar subir sem destino;
      # aqui o valor é `1` literal (não `${...}`), porque a decisão é desta
      # environment, não do `.env` de quem roda. O render continua imprimindo o
      # aviso em TODO boot — declarado não é escondido.
      - SHAMBLETA_ALERT_NO_PAGER_ACK=1
volumes:
  game-data-staging:
  game-backups-staging:
