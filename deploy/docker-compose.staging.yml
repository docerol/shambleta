# Shambleta — Staging override (Coolify environment: staging)
# Usa o mesmo Dockerfile da produção, mas com variáveis de ambiente diferentes.
services:
  web:
    environment:
      - SHAMBLETA_SERVER_ADDRESS=staging.seudominio.com
      - SHAMBLETA_SERVER_PORT=0
  game:
    environment:
      - SHAMBLETA_ENV=staging
  companion:
    environment:
      - SHAMBLETA_WEBHOOK_PROVIDER=shared
      - SHAMBLETA_ALLOW_DEV_WEBHOOK=1
      - SHAMBLETA_WEBHOOK_SECRET=${STAGING_WEBHOOK_SECRET:-}
volumes:
  game-data-staging:
