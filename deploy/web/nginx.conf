# Cloudflared tunnel: quando usado, o proxy do Cloudflare termina TLS
# e encaminha para o nginx (porta 80). Nenhuma mudança no nginx é necessária,
# apenas garantir que o server binda ws:// plain (SHAMBLETA_PROXY_TLS=1).
# Godot Web shell — COOP/COEP obrigatórios (thread_support=true usa
# SharedArrayBuffer; sem esses headers o browser bloqueia o boot).
# NOTA nginx: add_header não herda entre blocos — repetido em cada location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 9;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm application/javascript application/json
               application/octet-stream image/png image/svg+xml text/html text/plain;

    # index.html e workers: nunca cachear agressivo (deploys novos)
    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(service\.worker|audio\.position\.worklet|audio\.worklet)\.js$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-cache";
    }

    # Service worker para web push (deve estar na raiz para ter escopo /).
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html/;
    }

    # Music files: streamed separately for web-slim builds.
    location /music/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=86400";
        alias /usr/share/nginx/music/;
        expires 1d;
    }

    # Landing custom (modelo D) — DAO, guia, info
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    # SOM-IDLE beta — fronteira do dinheiro. O companion NÃO tem porta publicada
    # nem domínio próprio de propósito: é ele quem escreve em grant_queue. Quem
    # fala com ele chega por esta mesma origem:
    #   /checkout/{intents,preference,simulate} → o client do browser
    #   /webhooks/payments                      → o provedor de pagamento
    # Same-origin quer dizer sem CORS (o POST leva Content-Type: application/json,
    # que em outra origem exigia preflight) e sem mixed content na página HTTPS.
    # O corpo passa intacto — a assinatura do provedor é HMAC do body, então nada
    # aqui pode reescrever payload, path ou query.
    # resolver + variável: sem isso o nginx resolve o upstream no boot e o container
    # morre se o companion ainda não estiver na rede (e re-deploy troca o IP).
    location ~ ^/(checkout|webhooks)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shambleta_companion http://companion:8901;
        proxy_pass $shambleta_companion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
