# Cloudflared tunnel: quando usado, o proxy do Cloudflare termina TLS
# e encaminha para o nginx (porta 80). Nenhuma mudança no nginx é necessária,
# apenas garantir que o server binda ws:// plain (SHAMBLETA_PROXY_TLS=1).
# Godot Web shell — COOP/COEP obrigatórios (thread_support=true usa
# SharedArrayBuffer; sem esses headers o browser bloqueia o boot).
# NOTA nginx: add_header não herda entre blocos — repetido em cada location.
#
# Este arquivo é copiado para /etc/nginx/conf.d/default.conf
# (deploy/web/Dockerfile:30), que o nginx.conf da imagem lê DENTRO do bloco
# `http`. É por isso que os `limit_req_zone` abaixo podem viver aqui em cima:
# zona de rate-limit é diretiva de http, não de server — no lugar errado o nginx
# não sobe.
#
# VALIDADO ONDE: as diretivas e a forma do arquivo foram conferidas por
# tests/nginx_hardening_test.gd (parse + asserção de diretiva), que roda nesta
# máquina sem o binário do nginx. `nginx -t` NÃO foi rodado aqui — não há nginx
# instalado no host do gate. Isto é validação de arquivo, não de servidor vivo.
# Zonas de rate-limit (chaves por peer TCP). O dimensionamento é agregado de
# propósito: atrás do cloudflared/Coolify o `$binary_remote_addr` de TODOS os
# jogadores é o IP do proxy, então um teto "por IP" aqui não é por jogador — é o
# teto da fonte compartilhada. 5 r/s no checkout = 300/minutos agregados, muito
# acima do que um humano faz (clique) e abaixo do que um script faz; 25 r/s no
# webhook é o teto de retry do provedor, não do jogador. Um número "por jogador"
# exigiria `set_real_ip_from` com as faixas do túnel — topologia que não medimos
# nesta máquina, e número não medido é causa de indisponibilidade (mesma régua de
# deploy/docker-compose.yml:32 para a memória do `web`).
limit_req_zone $binary_remote_addr zone=shambleta_checkout:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shambleta_webhook:10m rate=25r/s;
# A rota de prontidão do push é a mais batida das três: cada boot de aba faz a
# pergunta, e em browser ela não tem sessão nem custo de banco. 10 r/s agregados
# fica uma ordem acima do que um deploy de jogadores faz ao mesmo tempo em boot e
# abaixo do que um script faz — mesmo critério das outras duas zonas (agregado por
# peer TCP, que atrás do túnel é o proxy, não o jogador).
limit_req_zone $binary_remote_addr zone=shambleta_push:10m rate=10r/s;
# O catálogo é a única rota pública lida pelo browser que TOCA o banco: cada GET
# resolve a temporada em vigor (`season_offer_status`) para marcar o passe à venda.
# Por isso a taxa é a mesma do checkout (5 r/s agregados por peer TCP), e não a do
# `push/vapid`, que não abre conexão nenhuma com o SQLite. `read` de preço não é
# writing: o burst de 20 cobre uma aba recarregada várias vezes, não um flood.
limit_req_zone $binary_remote_addr zone=shambleta_catalog:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SOM-IDLE (segurança, auditoria 2026-09-27): o `Server:` não entrega a versão
    # exata. O token de produto ("nginx") continua — tirar o nome é do módulo
    # headers-more, que a imagem nginx:1.27-alpine não tem, e o `Server: openresty`
    # que a auditoria viu vem do proxy em frente, não deste arquivo.
    server_tokens off;
    # Estouro de zona responde 429 (retry-able), não o 503 default: é o código que
    # o provedor de pagamento entende como "tenta de novo" e o client entende como
    # "não perdi o pagamento".
    limit_req_status 429;

    gzip on;
    gzip_comp_level 9;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm application/javascript application/json
               application/octet-stream image/png image/svg+xml text/html text/plain;

    # index.html e workers: nunca cachear agressivo (deploys novos)
    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(service\.worker|audio\.position\.worklet|audio\.worklet)\.js$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Frame-Options "DENY" always;
        # O shell do Godot precisa de wasm + blob worker: PINAR `script-src` aqui
        # sem medir (origens do Sentry e da ponte de ads entram no mesmo documento)
        # é a diferença entre um CSP e um client que não boota. O que se fecha
        # abaixo é o que não precisa de medição nenhuma: quem pode embutir a página
        # (ninguém), onde `<base>` pode apontar e `<object>/<embed>`.
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache";
    }

    # Service worker de web push: na raiz porque é ali que ele alcança o escopo
    # mais largo; o jogo o registra com escopo estreito '/sw/' para não
    # substituir o index.service.worker.js do engine, que é dono de '/'.
    # no-cache de propósito: um 304 velho seguraria o handler de push antigo.
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html/;
    }

    # SOM-W5/A: ponte de rewarded ads — no-cache de propósito (trocar o corpo
    # das funções com o SDK do portal é deploy; um 304 velho manteria TEST_MODE
    # ou o stub antigo no navegador do jogador).
    location = /ads_bridge.js {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache";
    }

    # Music files: streamed separately for web-slim builds.
    location /music/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=86400";
        alias /usr/share/nginx/music/;
        expires 1d;
    }

    # Landing custom (modelo D) — DAO, guia, info
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # SOM-IDLE beta — fronteira do dinheiro. O companion NÃO tem porta publicada
    # nem domínio próprio de propósito: é ele quem escreve em grant_queue. Quem
    # fala com ele chega por esta mesma origem:
    #   /checkout/{intents,preference,simulate} → o client do browser
    #   /webhooks/payments                      → o provedor de pagamento
    #   /push/vapid (exato, somente-leitura)    → a prontidão do sender de push
    # Same-origin quer dizer sem CORS (o POST leva Content-Type: application/json,
    # que em outra origem exigia preflight) e sem mixed content na página HTTPS.
    # O corpo passa intacto — a assinatura do provedor é HMAC do body, então nada
    # aqui pode reescrever payload, path ou query.
    # resolver + variável: sem isso o nginx resolve o upstream no boot e o container
    # morre se o companion ainda não estiver na rede (e re-deploy troca o IP).
    #
    # SOM-IDLE (segurança, auditoria 2026-09-27): até aqui estes dois caminhos
    # eram o único proxy do dinheiro e não tinham NENHUM teto — nem taxa, nem
    # tamanho de corpo, nem header de enquadramento. O corpo é o pior deles: o
    # companion lê `Content-Length` e aloca o buffer inteiro sem plafond
    # (companion/server.py:1405,1467), então o `client_max_body_size` daqui é o
    # único teto de alocação do caminho. Os dois blocos abaixo são o mesmo proxy de
    # antes, separados porque as duas rotas têm tráfegos e tetos diferentes.
    #
    # Sem allowlist de IP de propósito: atrás do cloudflared/Coolify o peer TCP é o
    # container do proxy, e uma faixa "127./172./10." liberaria a rede inteira do
    # compose — cerca que parece close e não close nada. A autenticação do webhook
    # continua sendo o HMAC do corpo (SHAMBLETA_MP_WEBHOOK_SECRET no companion); o
    # rate-limit só impede que a rota mais pública do caminho do dinheiro vire
    # amplificador.
    #
    # 16k é piso deliberado, não medida: notification do provedor e os intents do
    # checkout são JSON de ~1-3 KB. O pck do jogo (35 MiB) não passa por aqui.
    location ^~ /webhooks/ {
        # Este prefixo é o corredor de webhooks do companion, não só do de
        # pagamento: `POST /webhooks/ads` (prova de exibição de anúncio
        # recompensado, verificada em companion/ad_ssv.py) cai aqui de propósito e
        # herda taxa, teto de corpo e headers. Nenhuma `location` nova aqui: a
        # fronteira proxied deste servidor é exatamente checkout + push/vapid +
        # webhooks + catalog (tests/nginx_hardening_test.gd, suíte A), e um webhook
        # novo precisa de segredo próprio, não de um caminho novo na frente do
        # dinheiro.
        limit_req zone=shambleta_webhook burst=40 nodelay;
        client_max_body_size 16k;
        # corpo/cabeçalho lentos não seguram worker: 10 s é o bastante para um POST
        # de 16 KB em conexão de celular e longe do default de 60 s.
        client_body_timeout 10s;
        client_header_timeout 10s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shambleta_companion http://companion:8901;
        proxy_pass $shambleta_companion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Página nenhuma aqui: a resposta é JSON de reconhecimento. CSP fechada ao
        # máximo não quebra nada e é o fim da conversa sobre clickjacking.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /checkout/ {
        limit_req zone=shambleta_checkout burst=15 nodelay;
        client_max_body_size 16k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shambleta_companion http://companion:8901;
        proxy_pass $shambleta_companion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SOM-W5 (peças 2 e 3 do contrato de push — `WebPushDelivery.DeliverParts()`):
    # é por aqui que a prontidão do sender e a chave VAPID PÚBLICA chegam a um
    # browser. `NetworkCommons.ResolveCompanionURL` (:30) escolhe env > conf >
    # origem da página, e em browser só existe a origem da página; sem esta rota o
    # `GET /push/vapid` caía no `location /`, voltava HTML do SPA,
    # `WebPushService.ObserveCompanionPushResponse()` marcava `bad_response` e o
    # toggle de Settings ficava fechado para sempre — não por falta de sender, mas
    # por falta de caminho. O corpo é `ready` + pública + motivo coarse
    # (companion/server.py:1439): não toca o banco e `public_key` é o
    # `applicationServerKey` que o próprio navegador recebe, público por definição
    # (RFC 8292). O que NÃO é público continua fora: a fila.
    #
    # Exata (`=`) e não `^~ /push/` de propósito: com prefixo, `POST /push/test`
    # (companion/server.py:1458, drenagem da fila atrás de token próprio) passaria
    # a ser rota pública por cima da cerca do token. Exata, só `/push/vapid` vai ao
    # companion; `/push/test` cai no `location /`, é servido como SPA e morre lá.
    location = /push/vapid {
        limit_req zone=shambleta_push burst=10 nodelay;
        # GET/HEAD só. `limit_except` trava tudo que NÃO está na lista (exemplo
        # oficial do nginx), então um POST/PUT nesta rota sai 403 antes de tocar o
        # companion — a resposta não tem corpo de escrita nenhum para fazer.
        limit_except GET {
            deny all;
        }
        # O GET não traz corpo, mas o teto fica por consistência com as outras
        # rotas proxied: é o único plafond de alocação do caminho (o companion lê
        # `Content-Length` e aloca inteiro nas rotas de escrita).
        client_max_body_size 1k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shambleta_companion http://companion:8901;
        proxy_pass $shambleta_companion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 60 s, não `no-store` e não horas: a prontidão muda quando a chave VAPID
        # entra no deploy. `no-store` faria cada boot de aba bater no companion;
        # max-age longo faria o toggle demorar a abrir depois de configurar.
        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # `GET /catalog` é o preço que a página mostra. Aberta em 2026-09-28 porque a
    # vitrine não tinha como saber QUAL passe a temporada em vigor vende: o corpo
    # agora carrega `season_eligible` por passe (companion/server.py,
    # `public_catalog`), e sem rota o browser só via o `location /` (o HTML do jogo)
    # no lugar do JSON. Exata (`=`) e GET-only pelo mesmo motivo do `push/vapid`:
    # `^~ /catalog` abriria qualquer caminho novo ao companion por cima do rate-limit
    # do dinheiro, e o companion não tem rota de escrita embaixo de /catalog hoje
    # nem amanhã — a cerca é o método, não a lista de paths dele.
    location = /catalog {
        limit_req zone=shambleta_catalog burst=20 nodelay;
        limit_except GET {
            deny all;
        }
        client_max_body_size 1k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shambleta_companion http://companion:8901;
        proxy_pass $shambleta_companion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 60 s: preço e temporada mudam por deploy, não por minuto. Com `no-store`
        # cada aba do tamanho de uma loja batteria no SQLite do companion; com horas
        # o jogador veria preço velho depois de correção.
        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
