# Regras de alerta do server de jogo — a outra metade do `/metrics` (porta 9400).
#
# AUDITORIA §18: "divergência de reconcile não gera métrica nem sinal". A métrica
# sozinha não fecha isso: sem regra, o número fica num dashboard que ninguém
# abre às 3h. Este arquivo é o que transforma os gauges de
# `sources/system/MetricsServer.gd` em sinal.
#
# Formato: Prometheus `group_rules` padrão, carregável por
# `prometheus --config.file` (`rule_files: [deploy/alerts.rules.yml]`) ou por
# qualquer distro que entenda o schema (Grafana LGTM, VictoriaMetrics rules).
# O scrape do /metrics é por dentro do container do jogo, já que o bind é
# 127.0.0.1 e sem auth — o mesmo motivo pelo qual este arquivo não expõe nada:
# quem scrapeia tem que estar do lado de dentro.
#
# `tests/deploy_ops_test.gd` amarra as duas pontas: toda métrica citada aqui tem
# que existir no corpo que o server emite. Regra apontando para métrica que não
# existe é o alerta que nunca dispara e ninguém percebe.

groups:
  - name: shambleta-economia
    rules:
      # Dinheiro pago parado na fila: o jogador pagou e não recebeu. É o único
      # sintoma que o cliente percebe como "o jogo me roubou".
      - alert: GrantQueuePresa
        expr: shambleta_grant_queue_pending > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "grants pagos sem crédito há mais de 10 min"
          description: "{{ $value }} compras pagas aguardando crédito. O companion assinou e o server não consumiu a fila."

      # 'failed' é revisão humana por definição: o grant não entrou e ninguém vai
      # consertar sozinho.
      - alert: GrantQueueFalha
        expr: shambleta_grant_queue_failed > 0
        labels:
          severity: page
        annotations:
          summary: "grants falharam e esperam revisão manual"

      # divergence > 0 é o ledger dizendo uma coisa e a carteira outra. Não é page
      # porque o débito não foi perdido na mão do jogador — é o
      # reconciliador cumprindo o papel dele.
      - alert: ReconcileComDivergencia
        expr: shambleta_reconcile_divergences > 0
        labels:
          severity: ticket
        annotations:
          summary: "reconcile achou divergência entre ledger e carteiras"
          description: "{{ $value }} divergências no último run. Ver `reconcile_run` e a fila de revisão anti-fraude."

      # O job diário roda atrás do backup (SQLBackups). Passar de 25 h sem um run
      # significa backup desligado, ciclo travado ou processo sem _process — e é
      # por isso que esta regra vale mais que a de cima: sem reconcile, "0
      # divergências" é ausência de medida, não saúde.
      - alert: ReconcileParado
        expr: shambleta_reconcile_age_seconds > 90000
        labels:
          severity: page
        annotations:
          summary: "reconcile diário não roda há mais de 25 h"
          description: "Idade do último run: {{ $value }} s (-1 = nunca rodou neste banco)."

      - alert: FilaAntiFraudeAcumulada
        expr: shambleta_fraud_flags_open > 20
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "fila de revisão anti-fraude acumulando"
          description: "{{ $value }} flags abertas. Referral hold e chargeback shortfall ficam presos nela."

  - name: shambleta-processo
    rules:
      # O contrato do compose: `web` só sobe com `game` healthy. Se o probe sumiu,
      # a stack inteira para de subir no próximo restart.
      - alert: ServerSemServing
        expr: shambleta_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "server de jogo não está servindo"

      - alert: ServerSemMetrica
        expr: up{job="shambleta-game"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "/metrics do jogo sem scrape (porta 9400 é loopback por diseño)"

  - name: shambleta-escalabilidade
    rules:
      # O gargalo do processo é a queryMutex (sources/sql/SQL.gd:@queryMutex) — um round trip
      # que espera mais de 100 ms é um jogador travado no trabalho de outro, e é o
      # sintoma que antecede o teto de tick medido em deploy/SCALING.md. A média não
      # mostra isso (um passe de backup de 400 ms numa média de 3 µs some na média),
      # por isso a régua é no degrade acumulado, não na razão.
      - alert: QueryMutexTravando
        expr: increase(shambleta_sql_query_mutex_wait_over_100ms[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "round trip de SQL esperou a queryMutex mais de 100 ms"
          description: "{{ $value }} esperas >100 ms nos últimos 10 min. Antes de encostar no teto do tick, o processo encosta aqui."

      # ORÇAMENTO DE PASSO — a grandeza que faltava no /metrics. Até esta regra
      # existir, o processo confessava espera de mutex mas NADA confessava o custo
      # do passo do laço de 30 Hz: um servidor perdendo o tick passo a passo não
      # tinha como virar alerta, porque o número não saía do processo (só o painel
      # humano de `sources/gui/ServerDisplay.gd` o lia). Hoje `Launcher` acumula por
      # passo com `Time.get_ticks_usec()` e `MetricsServer` exporta; a régua é na
      # CAUDA e nunca na média, pelo mesmo motivo da regra de mutex acima — uma
      # média de 8 ms convive com 5% dos passos a 120 ms, e é esse 5% que o jogador
      # sente como o mundo andando em câmera lenta.
      #
      # Predícado do numerador (declarado na própria métrica): passo cujo período de
      # parede passou do orçamento MAIS a folga do throttle. A folga não é cosmética:
      # sem ela o sleep do próprio engine conta como estouro — piso ocioso mede
      # 33,61 ms contra 33,33 ms de orçamento, e uma régua estrita `>` denunciaria
      # 100% dos passos de um servidor vazio, que é o alerta que ninguém desliga.
      #
      # É fração, não contagem absoluta: 3 passos de 40 ms numa janela de 5 min é
      # um GC; 5% de todos os passos é o laço não cabendo no tick. O corte de 5% é
      # escolha declarada (a 30 Hz são ~1,5 passo por segundo sem relógio), não
      # número medido — medir o ponto de ruptura é o `multi_instance_tick_test`,
      # que cobra nos degraus afirmados a mesma fração deste `expr` e lê o número
      # aqui, do próprio arquivo: muda o percentual nesta regra e a escada muda com
      # ele; desaparece o `expr` e a escada fica vermelha em vez de guardar cópia.
      - alert: PassoForaDoOrcamento
        expr: rate(shambleta_step_over_budget_total[5m]) / rate(shambleta_steps_measured_total[5m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: ">= 5% dos passos de física estouraram o orçamento de tick por 10 min"
          description: "{{ $value }} é a fração de passos acima de orçamento+folga. Compare com `shambleta_step_budget_seconds` (o orçamento deste processo) e com a cauda do período no histograma; se `shambleta_step_lost_total` anda junto, o tick não está apenas estourando — está deixando de ser entregue."

      # `over_budget` diz que o passo foi longo; `lost` diz que o atraso virou
      # crédito não pago: `Engine.get_physics_frames()` andou menos que o tempo de
      # parede permitia. É o alerta do idle MMO — o mundo dos jogadores em offline
      # settle anda pelo relógio do passo, e passo perdido é hora de jogo que não
      # aconteceu. Uma linha só que seja, o player perdeu produção.
      - alert: PassoPerdido
        expr: increase(shambleta_step_lost_total[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "o processo deixou de entregar passos de física (atraso acumulado subiu)"
          description: "{{ $value }} passos não entregues nos últimos 5 min. Um passo perdido não é recuperado: o relógio do mundo atrasa junto."

      # Honestidade de cobertura: as séries do passo só existem depois da primeira
      # fronteira de física amostrada, e ausência aqui NÃO é "zero passos acima do
      # orçamento" — é "não estou medindo". Sem esta regra, um processo com o laço
      # parado (ou um scrape que sumiu) leria verde na régua de cima, que é a
      # mesma classe de falso verde que a regra `ReconcileParado` existe para o
      # reconcile.
      - alert: PassoSemMedida
        expr: absent(shambleta_steps_measured_total)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "/metrics sem as séries de orçamento de passo há 15 min"
          description: "Ou o laço de física deste processo não amostrou nenhum passo, ou o scrape caiu. Nos dois casos as regras de passo acima estão cegas, não verdes."

  - name: shambleta-schema
    rules:
      # P0-STAMP: desde 2026-09-28 o carimbo de versão é fail-closed — um patch que
      # estoura no SQLite PARA a sequência em vez de ser gravado como aplicado. O
      # motivo de ser página: até aqui a falha era um `push_error` no log do
      # container e a base subia sem o objeto de schema. As tabelas do dinheiro
      # vivem nesses patches, e o `/healthz` não olha schema — o sintoma chegava
      # como erro de login de jogador, dias depois do deploy que o causou.
      - alert: MigrationFalhou
        expr: shambleta_migration_failures_total > 0
        labels:
          severity: page
        annotations:
          summary: "patch de migration falhou e a base parou na versão anterior"
          description: "Patch travado: {{ $value }} (índice 0-based, -1 = nenhum). Rodar `docker compose exec game curl -s localhost:9400/metrics`, conferir `shambleta_migration_last_failed_patch` e o arquivo correspondente em `data/conf/migrations/`; depois disso reiniciar o `game` para o patch rodar de novo."

      # "Binário mais novo que o schema": é a mesma diferença vista pelo lado do
      # deploy. Sem o `for`, todo boot que aplica patches dispara no meio da janela
      # normal de migration; 10 min é o tempo de o apply terminar. Cobre também o
      # `stale` (binário velho demais, rollback) e o `empty` (o .pck sem
      # data/conf/migrations), que são os dois casos em que nada roda e nada era
      # dito.
      - alert: SchemaAtrasadoVsBinario
        expr: shambleta_migration_stalled == 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "binário com patch que a base não aplicou há mais de 10 min"
          description: "Base em `shambleta_schema_version`, binário com `shambleta_migration_patches_visible` patches. Rodar `docker compose logs --since 30m game | grep -i migration` para ver o patch e o motivo; se não houver, o pacote não traz `data/conf/migrations` (ver o `include_filter` do preset de servidor)."

      # O counter só anda em boot novo, então "parado" aqui é ausência de scrape ou
      # processo que não reiniciou nunca — a régua que impede o verde por inércia.
      - alert: SchemaSemMedida
        expr: shambleta_schema_version < 1
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "schema version lida do /metrics é 0 (base sem tabela migration)"
          description: "Nenhuma versão gravada. Rodar `docker compose exec game curl -s localhost:9400/metrics | grep shambleta_schema_version`; zero aqui é banco novo sem apply, não banco saudável."
