name: "godot-ci export"
on:
  push:
    branches:
      - '**'

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: "Shambleta"
  PROJECT_PATH: "."

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          export_template: "Linux/X11"
          ext: "x86_64"
        - name: Linux (Headless Server)
          export_template: "Linux/X11 Headless Server"
          ext: "x86_64"
        - name: Windows
          export_template: "Windows Desktop"
          ext: "exe"
        - name: macOS
          export_template: "macOS"
          ext: "zip"
        - name: Android
          export_template: "Android"
          ext: "apk"

    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    name: Export ${{ matrix.name }}
    env:
      SENTRY_DSN: ${{ secrets.SECRET_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libfontconfig1 unzip

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # Job em container roda como usuário não-root (HOME=/github/home), então
          # /root — onde a imagem já traz um debug.keystore — é só leitura: keytool
          # ali lia o alias existente, não conseguia escrever e morria com
          # "alias <androiddebugkey> already exists", derrubando os 5 exports do
          # matrix antes de qualquer build. Escrito onde o Godot realmente procura
          # (preset Android não define keystore próprio) e só gerado se não houver.
          DEBUG_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > "$DEBUG_KEYSTORE_PATH"
          elif [ -f /root/debug.keystore ]; then
            cp /root/debug.keystore "$DEBUG_KEYSTORE_PATH"
          else
            keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE_PATH" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -storetype pkcs12
          fi
          ls -l "$DEBUG_KEYSTORE_PATH"
        env:
          DEBUG_KEYSTORE: ${{ secrets.SECRET_RELEASE_KEYSTORE_BASE64 }}

      - name: Configure Sentry
        if: env.SENTRY_DSN != ''
        run: |
          cd "$PROJECT_PATH"
          sed -E -i 's/custom_features="([^"]*)"/custom_features="\1,sentry"/; s/custom_features=",/custom_features="/' export_presets.cfg
          sed -i "s|options/dsn=\"[^\"]*\"|options/dsn=\"$SENTRY_DSN\"|" project.godot

      - name: Install Android build template
        if: matrix.name == 'Android'
        run: |
          cd "$PROJECT_PATH"
          BUILD_VERSION=$(godot --version | sed -E 's/\.(official|custom_build)\..*$//')
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "$BUILD_VERSION" > android/.build_version
          echo "Installed Android build template version: $BUILD_VERSION"

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Build ${{ matrix.name }}
        run: |
          mkdir -p "build/${{ matrix.name }}"
          cd "$PROJECT_PATH"
          godot --headless --export-debug "${{ matrix.export_template }}" "build/${{ matrix.name }}/${EXPORT_NAME}.${{ matrix.ext }}"

      - name: Package ${{ matrix.name }}
        if: startsWith(matrix.name, 'Linux')
        run: |
          chmod +x "build/${{ matrix.name }}/${EXPORT_NAME}.${{ matrix.ext }}"
          tar -czvf "build/${{ matrix.name }}.tar.gz" -C "build/${{ matrix.name }}" .

      - name: Upload Artifact - ${{ matrix.name }} (Linux)
        if: startsWith(matrix.name, 'Linux')
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}.tar.gz

      - name: Upload Artifact - ${{ matrix.name }}
        if: ${{ !startsWith(matrix.name, 'Linux') }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}

  # SOM-IDLE code health: gate anti-god-node (>800 linhas, legado em allowlist).
  code-health:
    runs-on: ubuntu-latest
    name: Code Health (god-node gate)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run god-node gate
        run: |
          bash scripts/check_god_nodes.sh

  # SOM-IDLE: companion (fronteira de dinheiro real) — webhook HMAC, idempotência
  # do grant, refund sweep, checkout com binding de sessão. stdlib puro (sem
  # requirements). Rodar em CI é gate P0: bug aqui = prejuízo silencioso.
  companion-tests:
    runs-on: ubuntu-latest
    name: Companion Money Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run companion gates (webhook, security, refund CLI)
        # Mesmo `gate_py` do test.sh local: os três arquivos passam pelo quádruplo
        # de §24-8 (marcador de resultado presente, contagem de falhos lida do log,
        # exit code conferido à parte). Rodar python solto aqui deixava CI e local
        # provando coisas diferentes. Não precisa de Godot: o case `companion` só
        # chama python3.
        run: ./scripts/test.sh companion

  # SOM-IDLE: F2 idle-spike headless test suite (XP curve, zones, settle, ledger)
  # Beta fechado (2026-09-18): sem liuyuzui/godot-action-setup (setup quebrava
  # antes dos testes) — mesmo container barichello/godot-ci:4.7.1 dos jobs de
  # export, sem action externa. CI remoto não executado nesta rodada (sem
  # créditos); validado localmente: YAML parse + jobs de teste rodando no
  # Godot 4.7.2 headless local.
  idle-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    name: SOM-IDLE Idle Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Preflight harness parse
        run: |
          # Mesmo pré-checagem do scripts/test.sh all: um harness que não compila
          # faz o `load()`/`.new()` do runner falhar, nenhuma suíte roda e o job
          # só descobre no timeout de 1200 s. Custa ~1 s. A régua é ancorada em
          # SCRIPT ERROR: Parse Error — o `ERROR: …tscn - Parse Error:
          # [ext_resource]` que o modo --check-only emite é falso positivo do modo
          # (script que referencia autoload), não do código.
          cd "$PROJECT_PATH"
          fail=0
          for s in run_idle_tests IdleTests run_rpc_identity_test test_e2e_implementation test_backup_restore benchmarks; do
            errs="$(godot --headless --path . --check-only --script "tests/$s.gd" 2>&1 | grep '^SCRIPT ERROR: Parse Error' || true)"
            if [ -n "$errs" ]; then
              echo "::error::tests/$s.gd não compila"
              echo "$errs"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "Preflight parse OK: 6 harnesses, zero SCRIPT ERROR: Parse Error."

      - name: Run SOM-IDLE idle tests
        run: |
          # §24-8: `set +e` porque o gate lê o log ANTES de repassar o código de
          # saída — falhar sem explicar o motivo é como o healthcheck fictício
          # nasceu. Exit code do godot É a contagem de checks falhos (0 = verde).
          set +e
          cd "$PROJECT_PATH"
          # SOM-IDLE launch gaps: a suíte saiu de ~200 checks para mais de 2 mil, e o
          # total desta passada é o `== RESULT:` deste mesmo log — não ponho o número
          # aqui porque ele muda a cada commit e o comentário apodrece (estava em
          # 2017 quando a régua medida era outra). Com sims reais (onboarding, boss
          # ladder, probe realtime 300s), 300s matava o job no meio (timeout, não
          # falha). 1200s dá margem em runners lentos.
          timeout 1200 godot --headless --path . -s tests/run_idle_tests.gd > /tmp/idle-tests.log 2>&1
          bash scripts/ci_gate_log.sh /tmp/idle-tests.log "== RESULT:" "$?"

      # SOM-IDLE S1: única prova que o loopback offline não consegue dar —
      # servidor WebSocket real + dois clients reais, forjando peerID no corpo.
      - name: Run RPC identity transport test
        run: |
          set +e
          cd "$PROJECT_PATH"
          timeout 180 godot --headless --path . -s tests/run_rpc_identity_test.gd > /tmp/rpc-identity.log 2>&1
          bash scripts/ci_gate_log.sh /tmp/rpc-identity.log "== RPC IDENTITY:" "$?"

      # Este harness existia no repositório sem job nenhum: tabela de
      # chamador→método entre arquivos (Gui → Settings.get_sessionfirstlogin,
      # Settings → WebPush) que nunca rodava em lugar nenhum. É o que pega o
      # "Nonexistent function" em runtime antes de virar SCRIPT ERROR no log do
      # outro job — e o mesmo motivo pelo qual gut_runner.gd foi apagado: harness
      # que não roda é garantia falsa.
      - name: Run cross-file API verification
        run: |
          set +e
          cd "$PROJECT_PATH"
          timeout 120 godot --headless --path . -s tests/test_e2e_implementation.gd > /tmp/e2e-api.log 2>&1
          bash scripts/ci_gate_log.sh /tmp/e2e-api.log "== RESULT:" "$?"

  # SOM-IDLE A2: backup restore probe — monthly gate (runs on every push for now).
  backup-restore:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    name: Backup Restore Probe
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Run backup restore probe
        run: |
          set +e
          cd "$PROJECT_PATH"
          timeout 120 godot --headless --path . -s tests/test_backup_restore.gd > /tmp/backup.log 2>&1
          bash scripts/ci_gate_log.sh /tmp/backup.log "== Backup Restore Probe:" "$?"

  # SOM-IDLE P2: performance benchmark gate
  benchmarks:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    name: Performance Benchmarks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Run performance benchmarks
        run: |
          set +e
          cd "$PROJECT_PATH"
          timeout 120 godot --headless --path . -s tests/benchmarks.gd > /tmp/bench.log 2>&1
          bash scripts/ci_gate_log.sh /tmp/bench.log "== Benchmarks:" "$?"

  # SOM-IDLE beta deploy: export Web (pivô idle é web-first). O artifact é
  # servido com COOP/COEP pelo nginx do deploy/web/Dockerfile (Coolify).
  web-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    name: Export Web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      # Faltava aqui o setup que os jobs de matrix fazem: os templates vêm em
      # /root na imagem mas HOME=/github/home, então o export procurava
      # ~/.local/share/godot/export_templates/4.7.1.stable/web_dlink_release.zip
      # (dlink = preset Web com extensions_support, caso do gdsqlite) e não
      # achava. libfontconfig1 idem: sem ele o export não resolve as fontes.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libfontconfig1 unzip

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls "$TPL" | tr '\n' ' '
          # Falla aqui, com nome, em vez de 3 min depois no export com
          # "Cannot export project with preset Web due to configuration errors".
          [ -f "$TPL/web_dlink_release.zip" ] || { echo "::error::web_dlink_release.zip ausente nos templates da imagem"; exit 1; }

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Build Web
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build/Web
          # pasta destino criada ANTES do export: o plugin do Sentry copia
          # sentry-bundle.js no export_begin e aborta se o dir não existe.
          godot --headless --path . --export-release "Web" build/Web/index.html

      - name: Measure gzip weight (meta < 25 MB)
        run: |
          cd "$PROJECT_PATH/build/Web"
          total=0
          for f in index.pck index.wasm index.js index.side.wasm libgdsqlite*.wasm; do
            [ -f "$f" ] || continue
            gz=$(gzip -9 -c "$f" | wc -c)
            total=$((total+gz))
          done
          echo "First-load gzip: $((total/1024/1024)) MB"
          test "$total" -lt $((25*1024*1024)) || echo "::warning::first-load gzip acima da meta de 25 MB (ver deploy/COOLIFY.md §6)"

      - name: Upload Artifact - Web
        uses: actions/upload-artifact@v5
        with:
          name: Web
          path: build/Web

  snap:
    runs-on: ubuntu-latest
    needs: builds
    name: Pack and Publish Snap
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux build
        uses: actions/download-artifact@v5
        with:
          name: Linux
          path: .

      - name: Extract Linux build
        run: tar -xzvf Linux.tar.gz

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Upload Snap
        uses: actions/upload-artifact@v5
        with:
          name: Snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish snap
        if: github.ref == 'refs/heads/master' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
