name: "release"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

env:
  GODOT_VERSION: 4.7.1
  PROJECT_PATH: "."

permissions:
  contents: write

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          export_template: "Linux/X11"
          outname: "Shambleta"
          ext: "x86_64"
        - name: Linux (Headless Server)
          export_template: "Linux/X11 Headless Server"
          outname: "Shambleta Server"
          ext: "x86_64"
        - name: Windows
          export_template: "Windows Desktop"
          outname: "Shambleta"
          ext: "exe"
        - name: macOS
          export_template: "macOS"
          outname: "Shambleta"
          ext: "zip"
        - name: Android
          export_template: "Android"
          outname: "Shambleta"
          ext: "apk"

    runs-on: ubuntu-latest
    # Q-4 (auditoria 2026-10-06 §19): teto duro de job (régua em scripts/check_ci.sh).
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.7.1
    name: Export ${{ matrix.name }}
    env:
      SENTRY_DSN: ${{ secrets.SECRET_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libfontconfig1 unzip

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Finding #84 (2026-09-29): os dois blocos abaixo assinavam o APK DE RELEASE
      # com o par de chaves de DEBUG do Android — `/root/debug.keystore`, alias
      # `androiddebugkey`, senha `android`. Essa chave é pública: está no AOSP e
      # qualquer um que checar este repo regenera o mesmo keystore e assina o mesmo
      # código. Não é "assinado por nós" — é assinado por ninguém, e a loja/Play
      # App signing só esconde isso até alguém comparar as assinaturas.
      # Desde então: o keystore vem de secret, o job FALHA quando o secret falta
      # (recusar publicar é o comportamento correto; cair em debug é a doença), e
      # `scripts/check_ci.sh` tem uma régua que reprovou este arquivo exato antes de
      # ele ser consertado (canário M6 na saída do gate).
      - name: Require the real release keystore (Android)
        if: matrix.name == 'Android'
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_ALIAS" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::keystore de release ausente nos secrets (SECRET_RELEASE_KEYSTORE_BASE64 + SECRET_ANDROID_KEYSTORE_ALIAS + SECRET_ANDROID_KEYSTORE_PASSWORD). Assinar release com a debug key do Android está recusado — ela é pública. Configure os três secrets ou tire Android da matrix de release."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/shambleta-release.keystore"
          # RUNNER_TEMP é escrita fora do container (HOME=/github/home é efêmera e o
          # passo de export roda no mesmo job), com permissão só para o runner.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          # Conferir o alias AQUI: sem isto o erro aparece seis minutos depois,
          # dentro do `--export-release`, misturado com log de export.
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEYSTORE_ALIAS" >/dev/null
          echo "ANDROID_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_ALIAS=$RELEASE_KEYSTORE_ALIAS" >> "$GITHUB_ENV"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SECRET_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.SECRET_ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SECRET_ANDROID_KEYSTORE_PASSWORD }}

      - name: Enable production feature
        run: |
          cd "$PROJECT_PATH"
          sed -E -i 's/custom_features="([^"]*)"/custom_features="\1,production"/; s/custom_features=",/custom_features="/' export_presets.cfg

      - name: Configure Sentry
        if: env.SENTRY_DSN != ''
        run: |
          cd "$PROJECT_PATH"
          sed -E -i 's/custom_features="([^"]*)"/custom_features="\1,sentry"/; s/custom_features=",/custom_features="/' export_presets.cfg
          sed -i "s|options/dsn=\"[^\"]*\"|options/dsn=\"$SENTRY_DSN\"|" project.godot

      - name: Install Android build template
        if: matrix.name == 'Android'
        run: |
          cd "$PROJECT_PATH"
          BUILD_VERSION=$(godot --version | sed -E 's/\.(official|custom_build)\..*$//')
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "$BUILD_VERSION" > android/.build_version
          echo "Installed Android build template version: $BUILD_VERSION"

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Build ${{ matrix.name }}
        run: |
          mkdir -p "build/${{ matrix.name }}"
          cd "$PROJECT_PATH"
          godot --headless --export-release "${{ matrix.export_template }}" "build/${{ matrix.name }}/${{ matrix.outname }}.${{ matrix.ext }}"
        env:
          # Os três valores vêm do passo acima, que só existe quando o secret existe
          # e que falha o job quando não existe. Não há mais caminho de debug aqui.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.ANDROID_RELEASE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.SECRET_ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload Artifact - ${{ matrix.name }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}

  # Finding #83 (2026-09-29): este workflow era disparado à mão e não tinha UM job
  # de teste — `snap` publicava no canal `candidate` e `release` abria a GitHub
  # Release com `needs: builds` como único antecedente, e `builds` só exporta. A
  # régua antiga (scripts/check_ci.sh:190) chamava isso de gate porque aceitava
  # QUALQUER `needs`. A de agora exige que o fecho transitivo de `needs` de todo job
  # que publica contenha um job que rode testes de verdade — e este job é a porta
  # deles: o MESMO `scripts/test.sh all` que roda localmente, contra o commit
  # exato que virou release (`ref: github.sha` em todo checkout daqui).
  tests:
    runs-on: ubuntu-latest
    # Q-4 (auditoria 2026-10-06 §19): teto duro de job (régua em scripts/check_ci.sh).
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7.1
    name: Tests for the released commit
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libfontconfig1 unzip

      - name: Import assets
        run: |
          cd "$PROJECT_PATH"
          godot --headless --editor --import --quit

      - name: Run the whole gate on the commit being released
        run: |
          cd "$PROJECT_PATH"
          # Nenhuma lista de gates copiada aqui: `all` chama structure_gates() +
          # idle + rpc + backup + benchmarks + a suíte descoberta + companion, que é
          # exatamente o que um humano roda antes de dizer "está verde". O veredito é
          # a saída do test.sh, não um resumo escrito neste passo.
          bash scripts/test.sh all

  snap:
    runs-on: ubuntu-latest
    # Q-4 (auditoria 2026-10-06 §19): teto duro de job (régua em scripts/check_ci.sh).
    timeout-minutes: 30
    needs:
      - builds
      - tests
    name: Pack and Publish Snap
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download Linux build
        uses: actions/download-artifact@v5
        with:
          name: Linux
          path: .

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate

  release:
    runs-on: ubuntu-latest
    # Q-4 (auditoria 2026-10-06 §19): teto duro de job (régua em scripts/check_ci.sh).
    timeout-minutes: 15
    needs:
      - builds
      - tests
    name: Tag and Release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Read version from project.godot
        id: ver
        run: echo "version=$(grep -oP 'config/version=\"\K[^\"]+' project.godot)" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.ver.outputs.version }}"; then
            echo "Tag v${{ steps.ver.outputs.version }} already exists - bump config/version in project.godot first." && exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Package release assets
        uses: ./.github/actions/package-builds
        with:
          source-dir: dist
          output-dir: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "Shambleta v${{ steps.ver.outputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          draft: true
          files: assets/*
