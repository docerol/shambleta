[Linux]

; SOM-IDLE beta deploy: endpoint público do jogo. Vazio = defaults do código
; (som.manasource.org:6108). O deploy Coolify grava Server-Address no build do
; client web (wss:// na 443 do proxy). Server-Port: só para binds desktop
; especiais — NÃO usar no deploy web (o proxy é quem publica a porta).
[Network]
Server-Address=""
; 0 = usa a porta do código (6108 produção / 6118 testing). O sed do
; deploy/web/Dockerfile sobrescreve esta linha no build do client web.
Server-Port=0
; Base HTTP do companion (a fronteira do dinheiro: /checkout/* e /webhooks/*).
; Vazio é o caminho normal: no web o client usa a origem da própria página (o
; nginx do serviço `web` faz proxy dessas rotas para o companion na rede interna)
; e no desktop resta o loopback de desenvolvimento — ou seja, um build desktop
; distribuído só cobra se esta linha estiver preenchida (o beta é web-only; o CI
; exporta apenas o preset "Web"). Preenche-se só quando o
; companion mora num hostname separado — quem lê é Launcher._ready via
; NetworkCommons.ResolveCompanionURL.
Companion-Base=""
