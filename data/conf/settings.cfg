; Opt-in de verdade: o portão de envio (Monitoring.BeforeSend) só consulta a
; escolha salva do jogador, em [User], e descarta o evento quando não há escolha.
; Deixar isto em true fazia a tela de Privacy mostrar "ligado" enquanto nada era
; enviado — e assim que o jogador mexesse no botão (que escreve em [User]) o
; envio passava a valer sem que ele tivesse pedido.
Privacy-BugReports=false
Network-Local=false

